name: Verify live publication and notify IndexNow
on:
  workflow_run:
    workflows: ['Check and publish site']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: read
concurrency:
  group: live-publication-check
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Retrieve the checked build and prior published state
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name technical-checks --dir .reports/build
      - run: node scripts/build-static.mjs
        env:
          SITE_BASELINE_FILE: .reports/build/published-catalog.json
      - run: npm ci --ignore-scripts
      - name: Verify the exact published content versions and real HTTP status codes
        run: node scripts/seo/live.mjs
      - name: Verify the published Avito button after its actual JavaScript
        run: node scripts/seo/avito-live.cjs
      - name: Notify IndexNow about changed and removed public URLs
        run: node scripts/seo/indexnow.mjs
        env:
          INDEXNOW_PENDING_FILE: .reports/build/indexnow-pending.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-publication-report
          path: .reports/
          include-hidden-files: true
